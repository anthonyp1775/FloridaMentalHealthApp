spring.application.name=florida-mental-health-app

# dev | prod  --  override with -Dspring.profiles.active=prod
spring.profiles.active=dev

# ---------------------------------------------------------------------
# SECRETS
#
# Nothing secret has a default value anywhere in this repository. Both
# of the properties below resolve from, in order of precedence:
#
#   1. an OS environment variable
#   2. application-local.properties (gitignored, see the .example file)
#
# If neither supplies them the application refuses to start, which is
# the point: a working default is the thing that eventually gets
# committed by accident.
# ---------------------------------------------------------------------
spring.config.import=optional:classpath:application-local.properties

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Swagger UI -> http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Turn OFF the open-in-view anti-pattern. Leaving it on keeps the
# persistence session open during response rendering, which silently
# papers over lazy-loading mistakes by firing extra queries outside
# the service layer. Off means such a bug fails loudly where it lives.
spring.jpa.open-in-view=false
