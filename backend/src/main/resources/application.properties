spring.application.name=florida-mental-health-app

# dev | prod  --  override with -Dspring.profiles.active=prod
spring.profiles.active=dev

# JWT. The secret MUST come from the environment in prod.
app.jwt.secret=${JWT_SECRET:72d043df38edcb4002fcd02f369ef61ef5cfde48e1386a9828aec77475c027c6}
app.jwt.expiration-ms=86400000

# Swagger UI -> http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Turn OFF the open-in-view anti-pattern. Leaving it on keeps the
# persistence session open during response rendering, which silently
# papers over lazy-loading mistakes by firing extra queries outside
# the service layer. Off means such a bug fails loudly where it lives.
spring.jpa.open-in-view=false
