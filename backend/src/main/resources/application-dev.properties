# The SQL script is the source of truth for the schema.
#   validate - Hibernate checks entities against the real tables and
#              refuses to start on a mismatch (use once entities exist)
#   none     - no check at all (use while entities are still stubs)
# Do NOT use `update` alongside schema.sql - two sources of truth fight.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=DEBUG
