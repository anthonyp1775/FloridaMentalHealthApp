spring.datasource.url=jdbc:mysql://localhost:3306/fl_mental_health_db?createDatabaseIfNotExist=true

# The application connects as its own user, never as root. See the
# GRANT in README.md: full rights on this one schema, none on any
# other, and no user administration. A mistake in a query - or a
# compromised application - cannot reach another database.
spring.datasource.username=${DB_USERNAME:carepath_app}
spring.datasource.password=${DB_PASSWORD}

# The SQL script is the source of truth for the schema.
#   validate - Hibernate checks entities against the real tables and
#              refuses to start on a mismatch (use once entities exist)
#   none     - no check at all (use while entities are still stubs)
# Do NOT use `update` alongside schema.sql - two sources of truth fight.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=DEBUG
